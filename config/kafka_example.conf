# Example Kafka broker configuration (for local dev/testing only)
# Copy this into your Kafka config folder and update the values as needed.

# Unique broker identifier
broker.id=1

# Listeners define how clients connect to the broker
# e.g., PLAINTEXT://0.0.0.0:9092 for local testing
listeners=PLAINTEXT://localhost:9092

# Advertised listeners are what clients use to connect (Docker users often set host.docker.internal)
advertised.listeners=PLAINTEXT://localhost:9092

# Folders where Kafka stores logs for topics/partitions
log.dirs=/tmp/kafka-logs

# Zookeeper connection string (for classic Kafka w/ ZooKeeper)
zookeeper.connect=localhost:2181

# Uncomment/adjust the following to tune retention, replication, etc.
# offsets.topic.replication.factor=1
# transaction.state.log.replication.factor=1
# log.retention.hours=168
