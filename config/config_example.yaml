# Example configuration for the COMP7707 IoT weather anomaly project.
# Values here are placeholders and must be customised per environment.

kafka:
  # Bootstrap servers for Kafka cluster (comma separated list)
  bootstrap_servers: "localhost:9092"
  # Source topic for unprocessed sensor measurements
  topic_raw: "weather_raw"
  # Topic for downstream consumers/anomaly dashboard
  topic_processed: "weather_processed"
  # Consumer group for the raw stream processor
  group_id: "weather-processor-local"

data:
  sensors:
    - id: "sensor_north_01"
      location: "North rooftop"
    - id: "sensor_central_02"
      location: "Central courtyard"
    - id: "sensor_south_03"
      location: "South greenhouse"
  # Sampling cadence generated by the producer (seconds)
  frequency_seconds: 5

model:
  type: "isolation_forest"
  contamination: 0.025
  random_state: 42

storage:
  # Placeholder connection string for PostgreSQL (update before use)
  postgres_dsn: "postgresql://user:password@localhost:5432/weather_anomalies"
